name: quest_master
description: "Quest Master - Infinite narrative RPG powered by local AI (Ollama)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  # State Management - Riverpod
  # Chosen over BLoC for this project because:
  # 1. Deeply nested game state benefits from granular providers
  # 2. Async providers for AI calls
  # 3. Provider overrides for testing with MockAI
  # 4. No boilerplate events/states classes needed
  flutter_riverpod: ^2.6.1

  # Local Storage
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5

  # Networking (Ollama REST API)
  http: ^1.2.2

  # Utilities
  uuid: ^4.5.1
  equatable: ^2.0.7
  collection: ^1.19.0

  # UI
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
