name: quest_master
description: "Quest Master - Infinite narrative RPG powered by AI"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.6.1
  
  # Local Storage
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5
  
  # Networking (AI API)
  http: ^1.2.2
  
  # Firebase para Multiplayer
  firebase_core: ^3.8.1
  firebase_database: ^11.3.4
  
  # Utilities
  uuid: ^4.5.1
  equatable: ^2.0.7
  collection: ^1.19.0
  
  # UI
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true